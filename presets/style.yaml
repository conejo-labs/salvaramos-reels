canvas:
  width: 1080
  height: 1920
  fps: 30

safe_zone:
  bottom: 0.18
  right: 0.12
  left: 0.06

fonts_dir: assets/fonts

captions:
  font: Montserrat Black
  font_file: Montserrat-Black.ttf
  size: 84
  uppercase: true
  color: "#DCD1BF"
  active_color: "#29422C"
  active_outline_color: "#DCD1BF"
  active_scale: 1.25
  outline: 7
  outline_color: "#29422C"
  center_y: 0.68
  paging:
    max_words: 3
    max_duration: 1.2
    break_gap: 0.3
    tail: 0.15
  hide_during_promo: true

texts:
  title:
    font: Montserrat Black
    font_file: Montserrat-Black.ttf
    size: 88
    uppercase: true
    color: "#29422C"
    outline: 8
    outline_color: "#DCD1BF"
    center_y: 0.22
  nametag:
    font: Montserrat Black
    font_file: Montserrat-Black.ttf
    size: 96
    uppercase: true
    color: "#29422C"
    secondary_color: "#DCD1BF"
    secondary_outline_color: "#29422C"
    secondary_scale: 0.5
    outline: 7
    outline_color: "#DCD1BF"
    center_y: 0.68
    max_lines: 2
  headline:
    font: Anton
    font_file: Anton-Regular.ttf
    size: 150
    uppercase: true
    color: "#29422C"
    outline: 8
    outline_color: "#DCD1BF"
    center_y: 0.2
    max_lines: 2
  promo:
    font: Anton
    font_file: Anton-Regular.ttf
    size: 150
    uppercase: true
    color: "#29422C"
    outline: 8
    outline_color: "#DCD1BF"
    center_y: 0.45
    max_lines: 2

pip:
  width: 0.45
  max_height: 0.3
  left: 0.04
  bottom: 0.20
  positions:
    arriba:
      width: 0.62
      max_height: 0.35
      center_x: 0.5
      center_y: 0.3

cut:
  silence: true
  floor_percentile: 10
  above_floor_db: 10
  min_db: -52
  max_db: -36
  pad: 0.08
  min_gap: 0.12
  min_keep: 0.12
  fade: 0.01

transitions:
  punch_in: 1.12
  entry_zoom: 1.15
  entry_frames: 6
  flash_frames: 2
  flash_color: "#FFFFFF"
  flash_opacity: 0.85
  pop_from: 0.8
  pop_ms: 90

memes:
  max_seconds: 3.0
  target_mean_db: -20
  blur:
    radius: 30
    brightness: -0.15

cards:
  outro:
    duration: 2.5
    background: "#29422C"
    accent: "#DCD1BF"
    logo: assets/brand/imagotipo-crema.svg
    logo_width: 0.7
    center_y: 0.45
    sweep_seconds: 0.45
    logo_at: 0.2
    pop_seconds: 0.55
    drift: 0.04
    line_at: 0.65
    line_seconds: 0.45
    line_width: 0.55
    line_gap: 40
    line_thickness: 10
    text_rise: 40
    sfx: whoosh
  cierre:
    duration: 4.5
    background: "#29422C"
    accent: "#DCD1BF"
    logo: assets/brand/imagotipo-crema.svg
    logo_width: 0.55
    center_y: 0.41
    sweep_seconds: 0.45
    logo_at: 0.2
    pop_seconds: 0.55
    drift: 0.03
    line_at: 0.65
    line_seconds: 0.45
    line_width: 0.55
    line_gap: 30
    line_thickness: 8
    text_rise: 40
    sfx: whoosh
    texts:
      - {text: "¿Pasar el ramo\no ganar la final?", font_file: Anton-Regular.ttf, size: 120, color: "#DCD1BF",
         center_y: 0.2, at: 0.55, seconds: 0.4, line_spacing: 1.05}
      - {text: "Con SalvaRamos, las dos", font_file: Montserrat-Black.ttf, size: 84, color: "#DCD1BF",
         center_y: 0.57, at: 1.1, seconds: 0.4}
      - {text: "Prepara tus exámenes", font_file: Montserrat-Black.ttf, size: 64, color: "#DCD1BF",
         center_y: 0.64, at: 1.6, seconds: 0.4}
      - {text: "Link en la bio", font_file: Montserrat-Black.ttf, size: 64, color: "#29422C", pill: "#DCD1BF",
         padding: 28, center_y: 0.72, at: 2.0, seconds: 0.35}

looks:
  bw: "hue=s=0,eq=contrast=1.2"

audio:
  speech_lufs: -18
  broll_gain_db: -10
  loudness: -14
  true_peak: -1
  lra: 11

transcription:
  model: large-v3-turbo
  language: es
  no_speech_threshold: 0.6
  vocabulary:
    - SalvaRamos
    - 18SALVARAMOS
    - ramos
    - prueba
    - certamen
    - cálculo
    - receso
    - fonda
    - terremoto
  hallucinations:
    - gracias
    - gracias por ver el video
    - suscríbete al canal
    - amén

normalize:
  crf: 16
  preset: veryfast

export:
  crf: 18
  preset: slow
  audio_bitrate: 192k
  sample_rate: 48000

preview:
  seconds: 10
  width: 540
  height: 960
  preset: veryfast

review:
  columns: 6
  frame_width: 216
